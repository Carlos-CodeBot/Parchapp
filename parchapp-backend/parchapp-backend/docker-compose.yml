services:

  # ─── API Fastify ───────────────────────────────────────────
  api:
    build: .
    container_name: parchapp_api
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - parchapp_net

  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: parchapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parchapp_net

  # ─── Redis ─────────────────────────────────────────────────
  # Maneja las alertas en tiempo real y caché de sesiones
  redis:
    image: redis:7-alpine
    container_name: parchapp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - parchapp_net

  # ─── MinIO (almacenamiento de fotos, equivalente a S3) ─────
  minio:
    image: minio/minio:latest
    container_name: parchapp_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001" # Consola administrativa, solo desde el servidor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parchapp_net

  # ─── Nginx (proxy inverso, rate limiting y media) ────────
  nginx:
    image: nginx:alpine
    container_name: parchapp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - parchapp_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  parchapp_net:
    driver: bridge
