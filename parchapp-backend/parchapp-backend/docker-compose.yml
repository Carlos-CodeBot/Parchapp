version: '3.9'

services:

  # ─── API Fastify ───────────────────────────────────────────
  api:
    build: .
    container_name: parchapp_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - parchapp_net

  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: parchapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parchapp_net

  # ─── Redis ─────────────────────────────────────────────────
  # Maneja las alertas en tiempo real y caché de sesiones
  redis:
    image: redis:7-alpine
    container_name: parchapp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - parchapp_net

  # ─── MinIO (almacenamiento de fotos, equivalente a S3) ─────
  minio:
    image: minio/minio:latest
    container_name: parchapp_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Consola web (para administrar archivos visualmente)
    networks:
      - parchapp_net

  # ─── Nginx (proxy inverso, SSL, archivos estáticos) ────────
  nginx:
    image: nginx:alpine
    container_name: parchapp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro   # Tus certificados SSL aquí
    depends_on:
      - api
    networks:
      - parchapp_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  parchapp_net:
    driver: bridge
